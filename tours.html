<div style="padding:104px 0 24px;text-align:center;background:var(--bg-2);"><div class="container"><h1 style="font-size:2.4rem;">ทัวร์ทั้งหมด</h1><p style="color:var(--text-3);margin-top:8px;">ค้นหาแพ็กเกจทัวร์สุดหรูที่เหมาะกับคุณ</p></div></div>

<section class="section container">
<div class="filter-bar">
<div class="filter-tabs">
<button class="filter-tab active" data-type="all">ทั้งหมด</button>
<button class="filter-tab" data-type="beach"><i class="fas fa-umbrella-beach"></i> ชายหาด</button>
<button class="filter-tab" data-type="mountain"><i class="fas fa-mountain"></i> ภูเขา</button>
<button class="filter-tab" data-type="city"><i class="fas fa-city"></i> เมือง</button>
<button class="filter-tab" data-type="adventure"><i class="fas fa-hiking"></i> ผจญภัย</button>
</div>
<div style="display:flex;gap:12px;align-items:center;">
<div style="position:relative;flex:1;max-width:300px;">
  <input type="text" id="tourSearch" placeholder="ค้นหาทัวร์..." style="padding:10px 36px 10px 16px;background:var(--bg-input);border:1px solid var(--border);border-radius:8px;color:var(--text-1);font-size:.85rem;width:100%;outline:none;transition:var(--transition);" onfocus="this.style.borderColor='var(--gold)'" onblur="this.style.borderColor='var(--border)'">
  <button id="clearSearch" onclick="clearSearchInput()" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-3);cursor:pointer;display:none;padding:4px;"><i class="fas fa-times"></i></button>
</div>
<select id="sortSelect" style="padding:10px 16px;background:var(--bg-input);border:1px solid var(--border);border-radius:8px;color:var(--text-1);font-size:.85rem;outline:none;"><option value="default">เรียงตาม: แนะนำ</option><option value="low">ราคา: ต่ำ→สูง</option><option value="high">ราคา: สูง→ต่ำ</option><option value="rating">คะแนนสูงสุด</option></select>
</div>
</div>
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
<div id="tourCount" style="font-size:.85rem;color:var(--text-3);">กำลังโหลด...</div>
</div>
<div class="tour-grid" id="tourGrid"></div>
<div class="pagination" id="tourPagination"></div>
</section>

<div class="modal-overlay" id="tourModal"><div class="modal"><button class="modal-close" onclick="closeModal()">&times;</button><div class="modal-body"></div></div></div>

<script src="assets/js/app.js"></script>
<script>
// Initialize header on page load
document.addEventListener('DOMContentLoaded', function() {
  if(typeof initHeader === 'function') initHeader();
  if(typeof initTheme === 'function') initTheme();
  if(typeof updateWishlistBadge === 'function') updateWishlistBadge();
});

function goWishlist(e){e.preventDefault();const u=getUser();u?window.location.href='user.html?panel=wishlist':window.location.href='auth.html'}

function clearSearchInput() {
  const searchInput = document.getElementById('tourSearch');
  if(searchInput) {
    searchInput.value = '';
    _tourFilters.search = '';
    apply();
    document.getElementById('clearSearch').style.display = 'none';
    searchInput.focus();
  }
}

// Initialize tour filter on page load
document.addEventListener('DOMContentLoaded', function() {
  initTourFilter();
  
  const searchInput = document.getElementById('tourSearch');
  const clearBtn = document.getElementById('clearSearch');
  
  if(searchInput) {
    // Show/hide clear button based on input value
    searchInput.addEventListener('input', function() {
      if(clearBtn) {
        clearBtn.style.display = this.value ? 'block' : 'none';
      }
    });
    
    // Add Enter key support
    searchInput.addEventListener('keypress', function(e) {
      if(e.key === 'Enter') {
        e.preventDefault();
        _tourFilters.search = this.value;
        this.dispatchEvent(new Event('input'));
      }
    });
    
    // Focus search input on page load if there's a search query
    const params = new URLSearchParams(location.search);
    if(params.get('search')) {
      searchInput.focus();
    }
  }
});
</script>
