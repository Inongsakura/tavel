    }
    .btn-upload:disabled {

      cursor: not-allowed;

    }
    .status {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      background: #1a1a2e;
      max-height: 300px;

      font-size: 13px;

      padding: 6px 0;

    .info { color: #60a5fa; }
    .progress-bar {
      width: 100%;
      height: 10px;

      border-radius: 5px;
      margin-top: 20px;
      overflow: hidden;

    .progress-fill {

    // แสดงรายการทัวร์
    function showTourList() {
      const list = document.getElementById('tourList');
      list.innerHTML = TOUR_PACKAGES.map(t => 
        `<div class="tour-item">
          <span>
            <span class="tour-code">${t.code}</span> ${t.name}
            <span class="tour-type type-${t.type}">${t.type}</span>
          </span>
          <span class="tour-price">฿${t.price.toLocaleString()}</span>
        </div>`
      ).join('');
    }

    // เพิ่มข้อความใน status
    function addStatus(message, type = 'info') {
      const status = document.getElementById('status');
      const item = document.createElement('div');
      item.className = `status-item ${type}`;
      item.textContent = message;
      status.appendChild(item);
      status.scrollTop = status.scrollHeight;
    }

    // อัพโหลดข้อมูล
    async function startUpload() {
      const btn = document.getElementById('uploadBtn');
      const progressBar = document.getElementById('progressBar');
      const progressFill = document.getElementById('progressFill');
      
      btn.disabled = true;
      btn.textContent = '⏳ กำลังอัพโหลด...';
      progressBar.classList.add('active');
      
      addStatus('🚀 เริ่มอัพโหลดข้อมูลทัวร์ 20 รายการ...', 'info');
      addStatus('', 'info');
      
      let success = 0;
      let failed = 0;
      
      for (let i = 0; i < TOUR_PACKAGES.length; i++) {
        const tour = TOUR_PACKAGES[i];
        const progress = ((i + 1) / TOUR_PACKAGES.length) * 100;
        progressFill.style.width = progress + '%';
        
        try {
          await db.collection('tours').doc(tour.id).set({
            code: tour.code,
            name: tour.name,
            country: tour.country,
            type: tour.type,
            price: tour.price,
            nights: tour.nights,
            rating: tour.rating,
            reviews: tour.reviews,
            seats: tour.seats,
            status: tour.status,
            badge: tour.badge,
            desc: tour.desc,
            image: tour.image,
            images: [tour.image],
            createdAt: new Date().toISOString(),
            updatedAt: new Date().toISOString()
          });
          success++;
          addStatus(`✅ ${tour.code} - ${tour.name} (${tour.type})`, 'success');
        } catch (e) {
          failed++;
          addStatus(`❌ ${tour.code} - ${tour.name}: ${e.message}`, 'error');
        }
        
        // หน่วงเวลาเล็กน้อย
        await new Promise(r => setTimeout(r, 200));
      }
      
      addStatus('', 'info');
      addStatus('========================================', 'info');
      addStatus(`🎉 อัพโหลดเสร็จสิ้น!`, 'success');
      addStatus(`✅ สำเร็จ: ${success} รายการ`, 'success');
      if (failed > 0) {
        addStatus(`❌ ล้มเหลว: ${failed} รายการ`, 'error');
      }
      addStatus('========================================', 'info');
      addStatus('เปิด Firebase Console → Firestore → tours', 'info');
      
      btn.textContent = '✅ อัพโหลดเสร็จแล้ว!';
      progressBar.classList.remove('active');
    }

    // แสดงรายการทัวร์เมื่อโหลดหน้า
