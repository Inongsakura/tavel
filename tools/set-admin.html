<!DOCTYPE html>
<html lang="th" data-theme="dark">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>ตั้งค่า Admin - inongtravel</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23c9a96e'/><text x='50' y='68' font-size='55' font-weight='bold' text-anchor='middle' fill='white' font-family='serif'>i</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: 'Sarabun', sans-serif; 
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      background: #0f3460;
      border-radius: 20px;
      padding: 40px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      color: white;
    }
    h1 { color: #e94560; text-align: center; margin-bottom: 10px; font-size: 22px; }
    .subtitle { color: #a0a0a0; text-align: center; margin-bottom: 30px; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 8px; font-size: .9rem; color: #ccc; }
    .form-group input {
      width: 100%;
      padding: 12px 16px;
      background: #1a1a2e;
      border: 1px solid #333;
      border-radius: 10px;
      color: white;
      font-size: 1rem;
      outline: none;
    }
    .form-group input:focus { border-color: #e94560; }
    .btn {
      width: 100%;
      padding: 14px;
      font-size: 1rem;
      font-weight: bold;
      color: white;
      background: linear-gradient(135deg, #e94560 0%, #ff6b6b 100%);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn:disabled { background: #555; cursor: not-allowed; transform: none; }
    .status {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      background: #1a1a2e;
      font-size: .9rem;
    }
    .success { color: #4ade80; }
    .error { color: #f87171; }
    .info { color: #60a5fa; }
    .user-list { margin-top: 20px; }
    .user-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      background: #1a1a2e;
      border-radius: 8px;
      margin-bottom: 10px;
    }
    .user-item .email { color: #ccc; font-size: .9rem; }
    .user-item .role { 
      padding: 4px 12px; 
      border-radius: 20px; 
      font-size: .75rem; 
      font-weight: bold;
    }
    .role-admin { background: #e94560; color: white; }
    .role-member { background: #333; color: #aaa; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔑 ตั้งค่า Admin</h1>
    <p class="subtitle">จัดการสิทธิ์ผู้ใช้งาน</p>

    <div class="form-group">
      <label>อีเมลผู้ใช้</label>
      <input type="email" id="userEmail" placeholder="กรอกอีเมลที่ต้องการตั้งเป็น admin">
    </div>

    <button class="btn" id="setAdminBtn" onclick="setAdmin()">
      <i class="fas fa-user-shield"></i> ตั้งเป็น Admin
    </button>

    <div class="status" id="status" style="display:none;"></div>

    <h3 style="margin-top:30px;font-size:1rem;color:#ccc;">รายชื่อผู้ใช้ทั้งหมด</h3>
    <div class="user-list" id="userList">
      <div class="status info">กำลังโหลด...</div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAayCwC0UTVyISsKrNDNYdzGnQeFHpawAc",
      authDomain: "inong-56c0f.firebaseapp.com",
      projectId: "inong-56c0f",
      storageBucket: "inong-56c0f.firebasestorage.app",
      messagingSenderId: "838153924370",
      appId: "1:838153924370:web:7a133b12866b6671f84dcb"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    
    const auth = firebase.auth();
    const db = firebase.firestore();

    function showStatus(msg, type) {
      const el = document.getElementById('status');
      el.style.display = 'block';
      el.className = 'status ' + type;
      el.textContent = msg;
    }

    async function setAdmin() {
      const email = document.getElementById('userEmail').value.trim();
      const btn = document.getElementById('setAdminBtn');

      if (!email) {
        showStatus('กรุณากรอกอีเมล', 'error');
        return;
      }

      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> กำลังดำเนินการ...';
      btn.disabled = true;

      try {
        // Find user by email
        const usersRef = db.collection('users');
        const snapshot = await usersRef.where('email', '==', email).get();

        if (snapshot.empty) {
          showStatus('ไม่พบอีเมลนี้ในระบบ', 'error');
          btn.innerHTML = '<i class="fas fa-user-shield"></i> ตั้งเป็น Admin';
          btn.disabled = false;
          return;
        }

        // Update user role to admin
        const userDoc = snapshot.docs[0];
        await usersRef.doc(userDoc.id).update({ role: 'admin' });

        showStatus('ตั้งค่า admin สำเร็จ! อีเมล: ' + email, 'success');
        loadUsers(); // Refresh user list
      } catch (e) {
        showStatus('เกิดข้อผิดพลาด: ' + e.message, 'error');
      }

      btn.innerHTML = '<i class="fas fa-user-shield"></i> ตั้งเป็น Admin';
      btn.disabled = false;
    }

    async function loadUsers() {
      const list = document.getElementById('userList');
      try {
        const snapshot = await db.collection('users').get();
        if (snapshot.empty) {
          list.innerHTML = '<div class="status info">ยังไม่มีผู้ใช้</div>';
          return;
        }

        let html = '';
        snapshot.forEach(doc => {
          const user = doc.data();
          const roleClass = user.role === 'admin' ? 'role-admin' : 'role-member';
          html += `
            <div class="user-item">
              <span class="email">${user.email}</span>
              <span class="role ${roleClass}">${user.role || 'member'}</span>
            </div>
          `;
        });
        list.innerHTML = html;
      } catch (e) {
        list.innerHTML = '<div class="status error">เกิดข้อผิดพลาด: ' + e.message + '</div>';
      }
    }

    // Load users on page load
    loadUsers();
  </script>
</body>
</html>
