    function addStatus(msg, type='info') {
      const el = document.getElementById('status');
      const item = document.createElement('div');
      item.className = 'status-item ' + type;
      item.textContent = msg;
      el.appendChild(item);
      el.scrollTop = el.scrollHeight;
    }

    async function clearAndUpload() {
      const btn = document.getElementById('clearBtn');
      btn.disabled = true;
      btn.textContent = '⏳ กำลังทำงาน...';

      addStatus('🗑️ กำลังลบข้อมูลเก่า...', 'warning');

      // ลบข้อมูลทั้งหมดใน collection tours
      try {
        const snap = await db.collection('tours').get();
        for (const doc of snap.docs) {
          await doc.ref.delete();
        }
        addStatus('✅ ลบข้อมูลเก่าเสร็จ: ' + snap.size + ' รายการ', 'success');
      } catch (e) {
        addStatus('❌ ลบข้อมูลไม่ได้: ' + e.message, 'error');
      }

      addStatus('', 'info');
      addStatus('📤 กำลังอัพโหลดข้อมูลใหม่ ' + TOURS.length + ' รายการ...', 'info');

      // อัพโหลดข้อมูลใหม่
      let success = 0;
      for (const tour of TOURS) {
        try {
          await db.collection('tours').doc(tour.id).set(tour);
          success++;
          addStatus('✅ ' + tour.name + ' (' + (tour.packages ? tour.packages.length + ' packages' : 'no packages') + ')', 'success');
        } catch (e) {
          addStatus('❌ ' + tour.name + ': ' + e.message, 'error');
        }
      }

      addStatus('', 'info');
      addStatus('========================================', 'info');
      addStatus('🎉 เสร็จสิ้น! อัพโหลด ' + success + '/' + TOURS.length + ' รายการ', 'success');
      addStatus('========================================', 'info');
      addStatus('เปิด tours.html เพื่อดูผลลัพธ์', 'info');

      btn.textContent = '✅ เสร็จแล้ว!';
    }
  </script>
